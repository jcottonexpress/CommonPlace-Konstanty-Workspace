kind = "web"
previewPath = "/"
title = "CommonPlace"
version = "1.0.0"
id = "artifacts/commonplace"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21088

[services.development]
run = "pnpm --filter @workspace/commonplace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/commonplace", "run", "build" ]
publicDir = "artifacts/commonplace/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21088"
BASE_PATH = "/"
